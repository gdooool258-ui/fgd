<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ظرف مفاجأة لخوله 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,400&family=Cairo:wght@400;600;700;800&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffe6eb 0%, #ffd1dc 40%, #fbc4ab 100%);
      font-family: 'Cairo', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background Glow */
    .bg-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 182, 193, 0.6) 0%, rgba(255, 255, 255, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }

    /* Music Floating Button */
    .music-control {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(220, 53, 69, 0.15);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: all 0.3s ease;
    }

    .music-btn {
      background: #ff4d6d;
      color: white;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(255, 77, 109, 0.4);
      transition: transform 0.2s, background 0.2s;
    }

    .music-btn:hover {
      transform: scale(1.08);
      background: #ff2a55;
    }

    .volume-slider {
      width: 70px;
      accent-color: #ff4d6d;
      cursor: pointer;
    }

    /* Scene Container */
    .container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 500px;
      padding: 20px;
    }

    /* Stage 1: Envelope Wrapper */
    .envelope-wrapper {
      perspective: 1000px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .envelope-wrapper:hover {
      transform: translateY(-8px) scale(1.02);
    }

    .envelope {
      width: 290px;
      height: 190px;
      background-color: #ff758f;
      position: relative;
      border-radius: 0 0 15px 15px;
      box-shadow: 0 20px 40px rgba(186, 24, 27, 0.25);
    }

    /* Flap Top */
    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      border-left: 145px solid transparent;
      border-right: 145px solid transparent;
      border-top: 110px solid #ff4d6d;
      transform-origin: top;
      transition: transform 0.6s ease 0.2s, z-index 0.2s ease 0.4s;
      z-index: 4;
    }

    .envelope.open::before {
      transform: rotateX(180deg);
      z-index: 1;
    }

    /* Left & Right Pocket Folds */
    .envelope::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 145px solid #ff597b;
      border-right: 145px solid #ff597b;
      border-bottom: 95px solid transparent;
      border-top: 95px solid transparent;
      border-radius: 0 0 15px 15px;
      z-index: 3;
    }

    /* Inner Card inside Envelope */
    .card-inside {
      position: absolute;
      bottom: 10px;
      left: 5%;
      width: 90%;
      height: 160px;
      background: #fff;
      border-radius: 10px;
      z-index: 2;
      transition: transform 0.6s ease 0.5s;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      padding: 15px;
      text-align: center;
    }

    .envelope.open .card-inside {
      transform: translateY(-90px);
    }

    /* Wax Seal Button */
    .wax-seal {
      position: absolute;
      top: 95px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 55px;
      height: 55px;
      background: radial-gradient(circle, #d90429, #8d0801);
      border-radius: 50%;
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 22px;
      box-shadow: 0 6px 15px rgba(141, 8, 1, 0.4);
      border: 2px solid #ffb5a7;
      transition: opacity 0.4s ease, transform 0.3s ease;
    }

    .envelope.open .wax-seal {
      opacity: 0;
      pointer-events: none;
    }

    .tap-hint {
      margin-top: 35px;
      color: #c9184a;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      animation: pulseText 1.5s infinite alternate;
    }

    @keyframes pulseText {
      0% { opacity: 0.6; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.03); }
    }

    /* Modal Password Stage */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: rgba(255, 255, 255, 0.95);
      padding: 35px 30px;
      border-radius: 25px;
      box-shadow: 0 25px 50px rgba(255, 77, 109, 0.25);
      text-align: center;
      max-width: 380px;
      width: 90%;
      transform: scale(0.8);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 2px solid #ffccd5;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-card h3 {
      color: #a4133c;
      font-size: 1.4rem;
      margin-bottom: 10px;
    }

    .modal-card p {
      color: #555;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .password-input {
      width: 100%;
      padding: 14px 20px;
      border: 2px solid #ffb5a7;
      border-radius: 50px;
      outline: none;
      font-size: 1.1rem;
      text-align: center;
      font-family: 'Cairo', sans-serif;
      transition: border-color 0.3s, box-shadow 0.3s;
      background: #fff5f6;
    }

    .password-input:focus {
      border-color: #ff4d6d;
      box-shadow: 0 0 12px rgba(255, 77, 109, 0.3);
      background: #fff;
    }

    .error-msg {
      color: #d90429;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: -12px;
      margin-bottom: 12px;
      min-height: 20px;
      display: none;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(45deg, #ff4d6d, #ff758f);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      font-family: 'Cairo', sans-serif;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(255, 77, 109, 0.5);
    }

    /* Stage 3: Final Name Display */
    .reveal-container {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: zoomIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      z-index: 20;
    }

    @keyframes zoomIn {
      0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1); }
    }

    .name-title {
      font-family: 'Amiri', serif;
      font-size: 5rem;
      font-weight: 700;
      color: #800f2f;
      text-shadow: 
        0 0 20px rgba(255, 182, 193, 0.8),
        2px 2px 4px rgba(0, 0, 0, 0.1);
      margin-bottom: 10px;
      position: relative;
    }

    .sub-title {
      font-size: 1.5rem;
      color: #c9184a;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.6);
      padding: 8px 25px;
      border-radius: 30px;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 15px rgba(201, 24, 74, 0.1);
    }

    /* Falling Hearts Canvas */
    #heartsCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 50;
    }

    /* Responsive Adjustments */
    @media (max-width: 480px) {
      .envelope {
        width: 250px;
        height: 165px;
      }
      .envelope::before {
        border-left-width: 125px;
        border-right-width: 125px;
        border-top-width: 95px;
      }
      .envelope::after {
        border-left-width: 125px;
        border-right-width: 125px;
        border-bottom-width: 82px;
        border-top-width: 82px;
      }
      .name-title {
        font-size: 3.8rem;
      }
      .sub-title {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Glow -->
  <div class="bg-glow"></div>

  <!-- Music Control (Visitor can Mute/Play, Source is hidden in Code) -->
  <div class="music-control">
    <button class="music-btn" id="musicToggleBtn" title="تشغيل / إيقاف الموسيقى">🎵</button>
    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="0.6">
  </div>

  <!-- Audio Element (تستطيع تغيير رابط الموسيقى من هنا في الكود فقط) -->
  <audio id="bgMusic" loop src="https://c.top4top.io/m_394144uqm1.mp3"></audio>

  <!-- Hearts Canvas -->
  <canvas id="heartsCanvas"></canvas>

  <!-- Main Interactive Area -->
  <div class="container">
    
    <!-- STAGE 1: Envelope -->
    <div class="envelope-wrapper" id="envelopeWrapper">
      <div class="envelope" id="envelope">
        <div class="wax-seal">💌</div>
        <div class="card-inside">
          <p style="color: #ff4d6d; font-weight: bold; font-size: 1.1rem;">رسالة خاصة جداً ❤️</p>
        </div>
      </div>
      <div class="tap-hint">اضغط على الظرف لفتحه 💖</div>
    </div>

    <!-- STAGE 3: Final Name Display -->
    <div class="reveal-container" id="revealContainer">
      <h1 class="name-title">خوله داده</h1>
      <div class="sub-title">✨ أنتِ أجمل ما في العالم ✨</div>
    </div>

  </div>

  <!-- STAGE 2: Password Modal Overlay -->
  <div class="modal-overlay" id="passwordModal">
    <div class="modal-card">
      <h3>الرسالة محمية بكلمة سر 🔒</h3>
      <p>يرجى إدخال كلمة السر لفتح الرسالة</p>
      <div class="input-group">
        <input type="password" id="passwordInput" class="password-input" placeholder="أدخل كلمة السر هنا..." autocomplete="off">
      </div>
      <div class="error-msg" id="errorMsg">كلمة السر غير صحيحة، حاول مجدداً ❤️</div>
      <button class="submit-btn" id="submitPassBtn">فتح الرسالة ✨</button>
    </div>
  </div>

  <script>
    // Audio Player Elements
    const bgMusic = document.getElementById('bgMusic');
    const musicToggleBtn = document.getElementById('musicToggleBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    let isPlaying = false;

    // Toggle Play/Pause Music
    function toggleAudio() {
      if (isPlaying) {
        bgMusic.pause();
        musicToggleBtn.textContent = '🔇';
        isPlaying = false;
      } else {
        bgMusic.play().then(() => {
          musicToggleBtn.textContent = '🎵';
          isPlaying = true;
        }).catch(err => {
          console.log("Autoplay restriction:", err);
        });
      }
    }

    musicToggleBtn.addEventListener('click', toggleAudio);

    // Volume Control
    volumeSlider.addEventListener('input', (e) => {
      bgMusic.volume = e.target.value;
    });

    // Try starting music on first touch/click anywhere
    document.body.addEventListener('click', function startAudioOnFirstUserInteraction() {
      if (!isPlaying && bgMusic.src) {
        bgMusic.volume = volumeSlider.value;
        bgMusic.play().then(() => {
          isPlaying = true;
          musicToggleBtn.textContent = '🎵';
        }).catch(() => {});
      }
    }, { once: true });

    // Interactive Logic
    const envelopeWrapper = document.getElementById('envelopeWrapper');
    const envelope = document.getElementById('envelope');
    const passwordModal = document.getElementById('passwordModal');
    const passwordInput = document.getElementById('passwordInput');
    const submitPassBtn = document.getElementById('submitPassBtn');
    const errorMsg = document.getElementById('errorMsg');
    const revealContainer = document.getElementById('revealContainer');

    // Envelope Click -> Open Envelope & Show Modal
    envelopeWrapper.addEventListener('click', () => {
      envelope.classList.add('open');
      setTimeout(() => {
        passwordModal.classList.add('active');
        passwordInput.focus();
      }, 900);
    });

    // Submit Password Action
    function checkPassword() {
      const val = passwordInput.value.trim();
      if (val === 'خوله' || val === 'خولة') {
        // Success
        passwordModal.classList.remove('active');
        envelopeWrapper.style.display = 'none';
        revealContainer.style.display = 'flex';
        
        // Start Hearts Animation
        startHearts();
      } else {
        // Error Shake Effect
        errorMsg.style.display = 'block';
        passwordInput.style.borderColor = '#d90429';
        passwordInput.classList.add('shake');
        setTimeout(() => {
          passwordInput.classList.remove('shake');
        }, 500);
      }
    }

    submitPassBtn.addEventListener('click', checkPassword);

    passwordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        checkPassword();
      }
    });

    passwordInput.addEventListener('input', () => {
      errorMsg.style.display = 'none';
      passwordInput.style.borderColor = '#ffb5a7';
    });

    // Falling Hearts System
    const canvas = document.getElementById('heartsCanvas');
    const ctx = canvas.getContext('2d');
    let hearts = [];
    let animationFrameId;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Heart {
      constructor() {
        this.reset(true);
      }

      reset(firstRun = false) {
        this.x = Math.random() * canvas.width;
        this.y = firstRun ? Math.random() * canvas.height : -20;
        this.size = Math.random() * 18 + 10; // size 10 to 28
        this.speedY = Math.random() * 1.5 + 1;
        this.speedX = Math.sin(Math.random() * Math.PI) * 0.8;
        this.opacity = Math.random() * 0.6 + 0.4;
        this.color = ['#ff4d6d', '#ff758f', '#ffb3c1', '#c9184a', '#ff8fa3'][Math.floor(Math.random() * 5)];
        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 2;
      }

      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.01) * 0.8;
        this.rotation += this.rotationSpeed;

        if (this.y > canvas.height + 30) {
          this.reset(false);
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;
        
        // Draw Heart Shape
        ctx.beginPath();
        const topCurveHeight = this.size * 0.3;
        ctx.moveTo(0, topCurveHeight);
        ctx.bezierCurveTo(0, 0, -this.size / 2, 0, -this.size / 2, topCurveHeight);
        ctx.bezierCurveTo(-this.size / 2, (this.size + topCurveHeight) / 2, 0, this.size, 0, this.size);
        ctx.bezierCurveTo(0, this.size, this.size / 2, (this.size + topCurveHeight) / 2, this.size / 2, topCurveHeight);
        ctx.bezierCurveTo(this.size / 2, 0, 0, 0, 0, topCurveHeight);
        ctx.closePath();
        ctx.fill();
        
        ctx.restore();
      }
    }

    function startHearts() {
      hearts = [];
      const heartCount = window.innerWidth < 500 ? 35 : 60;
      for (let i = 0; i < heartCount; i++) {
        hearts.push(new Heart());
      }
      animateHearts();
    }

    function animateHearts() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hearts.forEach(heart => {
        heart.update();
        heart.draw();
      });
      animationFrameId = requestAnimationFrame(animateHearts);
    }
  </script>
</body>
</html>
